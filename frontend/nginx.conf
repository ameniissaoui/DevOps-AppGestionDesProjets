server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API REST -> conteneur backend (résolu via le réseau Docker)
    location ~ ^/(entreprise|equipe|projet|projet-detaille)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Routes Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
