# Stack complète : MySQL + Backend Spring Boot + Frontend Angular (nginx)
# Lancer : docker compose up -d --build
name: gestion-projets

services:
  mysql-db:
    image: mysql:8.0
    container_name: gp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    volumes:
      - mysql-data:/var/lib/mysql          # volume persistant
    networks:
      - gp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    image: ${DOCKERHUB_USER:-local}/gestion-projets-backend:${TAG:-latest}
    container_name: gp-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8089:8080"                        # 8080 est déjà pris par Jenkins dans la VM
    depends_on:
      mysql-db:
        condition: service_healthy         # le backend démarre après la BD
    networks:
      - gp-network

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USER:-local}/gestion-projets-frontend:${TAG:-latest}
    container_name: gp-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend                            # le frontend démarre après le backend
    networks:
      - gp-network

volumes:
  mysql-data:

networks:
  gp-network:
    driver: bridge
