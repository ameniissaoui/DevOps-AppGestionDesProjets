# Atelier 8 - Partie 2B : Backend Spring Boot
# kubectl apply -f k8s/spring-deployment.yaml

# 1 - ConfigMap : configuration non sensible
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-config
  namespace: devops
data:
  # "mysql-service" = nom du Service MySQL, résolu par le DNS interne du cluster (CoreDNS)
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-service:3306/springdb
---
# 2 - Secret : identifiants (valeurs encodées en base64)
apiVersion: v1
kind: Secret
metadata:
  name: spring-secret
  namespace: devops
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: c3ByaW5n        # spring
  SPRING_DATASOURCE_PASSWORD: c3ByaW5nMTIz    # spring123
---
# 3 - Deployment Spring Boot
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring
  template:
    metadata:
      labels:
        app: spring
    spec:
      # Attendre que MySQL accepte les connexions avant de lancer Spring Boot
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql-service 3306; do echo 'attente MySQL...'; sleep 3; done"]
      containers:
        - name: spring
          image: ameniissaoui/backend:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: spring-config
            - secretRef:
                name: spring-secret
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
# 4 - Service Spring Boot : NodePort = accessible depuis l'extérieur du cluster
apiVersion: v1
kind: Service
metadata:
  name: spring-service
  namespace: devops
spec:
  type: NodePort
  selector:
    app: spring
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
