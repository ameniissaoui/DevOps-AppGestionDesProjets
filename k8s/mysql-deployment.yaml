# Atelier 8 - Partie 2A : Base de données MySQL
# kubectl apply -f k8s/mysql-deployment.yaml

# 1 - PersistentVolume : espace disque réservé sur le nœud (hostPath)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  # "manual" : le PVC se lie à ce PV au lieu d'un volume créé dynamiquement par Minikube
  storageClassName: manual
  hostPath:
    path: /data/mysql
---
# 2 - PersistentVolumeClaim : demande de stockage utilisée par le pod MySQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: devops
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 3 - Deployment MySQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: devops
spec:
  replicas: 1
  strategy:
    type: Recreate        # volume ReadWriteOnce : jamais deux pods MySQL en même temps
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root123
            - name: MYSQL_DATABASE
              value: springdb
            # Utilisateur applicatif utilisé par le backend (cf. spring-secret)
            - name: MYSQL_USER
              value: spring
            - name: MYSQL_PASSWORD
              value: spring123
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
---
# 4 - Service MySQL : ClusterIP = accessible uniquement depuis l'intérieur du cluster
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: devops
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
