# Atelier 8 - Partie 1 : Frontend Angular (nginx)
# kubectl apply -f k8s/frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ameniissaoui/frontend:1.0
          ports:
            - containerPort: 80
          env:
            # nginx relaie les appels API vers le Service du backend (Partie 2)
            - name: BACKEND_HOST
              value: spring-service.devops.svc.cluster.local
            - name: BACKEND_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: devops
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
